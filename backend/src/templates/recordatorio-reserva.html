<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Recordatorio de reserva</title>
</head>
<body style="margin:0;padding:0;background-color:#0F1117;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0F1117;padding:32px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background-color:#16213E;border-radius:12px;overflow:hidden;">
          <tr>
            <td style="background-color:#F5A623;padding:24px 32px;">
              <h1 style="margin:0;color:#0F1117;font-size:22px;">🔔 Recordatorio de reserva</h1>
              <p style="margin:4px 0 0;color:#0F1117;opacity:0.85;font-size:13px;">RC Arena & Carreras</p>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;color:#ffffff;">
              <h2 style="margin-top:0;color:#E94560;">¡Hola {{nombre}}, tu sesión es mañana!</h2>
              <table role="presentation" width="100%" cellpadding="8" cellspacing="0" style="background-color:#1A1A2E;border-radius:8px;margin:16px 0;">
                <tr><td style="color:#8892A4;">Fecha</td><td style="color:#ffffff;font-weight:bold;">{{fecha}}</td></tr>
                <tr><td style="color:#8892A4;">Horario</td><td style="color:#ffffff;font-weight:bold;">{{horario}}</td></tr>
                <tr><td style="color:#8892A4;">Plan</td><td style="color:#ffffff;font-weight:bold;">{{tier}}</td></tr>
              </table>
              <p style="color:#8892A4;line-height:1.6;">
                Llega 10 minutos antes para el briefing de seguridad. ¡Te esperamos en la pista!
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px;background-color:#1A1A2E;color:#8892A4;font-size:12px;">
              RC Arena & Carreras · Curauma, Chile
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
