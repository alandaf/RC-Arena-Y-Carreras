<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Nueva notificación</title>
</head>
<body style="margin:0;padding:0;background-color:#0A0A0A;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0A0A0A;padding:32px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background-color:#1C1B1F;border-radius:12px;overflow:hidden;">
          <tr>
            <td style="background-color:#22C55E;padding:24px 32px;">
              <h1 style="margin:0;color:#0A0A0A;font-size:22px;">📋 Nueva actividad en el sitio</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;color:#ffffff;">
              <table role="presentation" width="100%" cellpadding="8" cellspacing="0" style="background-color:#0A0A0A;border-radius:8px;">
                <tr><td style="color:#9C9691;">Nombre</td><td style="color:#ffffff;font-weight:bold;">{{nombre}}</td></tr>
                <tr><td style="color:#9C9691;">Email</td><td style="color:#ffffff;font-weight:bold;">{{email}}</td></tr>
                <tr><td style="color:#9C9691;">Teléfono</td><td style="color:#ffffff;font-weight:bold;">{{telefono}}</td></tr>
                <tr><td style="color:#9C9691;">Fecha</td><td style="color:#ffffff;font-weight:bold;">{{fecha}}</td></tr>
                <tr><td style="color:#9C9691;">Horario</td><td style="color:#ffffff;font-weight:bold;">{{horario}}</td></tr>
                <tr><td style="color:#9C9691;">Tipo / Plan</td><td style="color:#ffffff;font-weight:bold;">{{tier}}</td></tr>
                <tr><td style="color:#9C9691;">Personas</td><td style="color:#ffffff;font-weight:bold;">{{personas}}</td></tr>
              </table>
              <p style="color:#9C9691;line-height:1.6;margin-top:16px;">
                <strong style="color:#F7941D;">Mensaje:</strong><br />{{mensaje}}
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px;background-color:#0A0A0A;color:#9C9691;font-size:12px;">
              RC Arena & Carreras · Panel interno
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
