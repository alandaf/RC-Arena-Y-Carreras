<!DOCTYPE html>

<body style="margin:0;padding:0;background-color:#0F1117;font-family:Arial,Helvetica,sans-serif;">

    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background-color:#16213E;border-radius:12px;overflow:hidden;">

          </tr>
          <tr>
            <td style="padding:32px;color:#ffffff;">

              <p style="color:#8892A4;line-height:1.6;">

              </p>
              <p style="color:#06A77D;font-weight:bold;">¡Gracias por tu interés en RC Arena & Carreras!</p>
            </td>
          </tr>

            </td>

        </table>
      </td>
    </tr>
